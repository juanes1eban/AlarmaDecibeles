# Al subir un tag vX.Y.Z: compila la app, arma el instalador y lo publica como Release en GitHub.
#   git tag v1.0.2
#   git push origin v1.0.2
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # El tag se pasa por env (no con ${{ }} dentro del script) para que un nombre de tag
      # con $(...) no se ejecute como código.
      - name: Versión desde el tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "El tag debe ser vX.Y.Z (recibí $env:TAG)" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Publicar app (self-contained, no necesita .NET instalado)
        run: dotnet publish AlarmaDecibeles.csproj -c Release -r win-x64 --self-contained -p:Version=${{ env.VERSION }} -o publish

      - name: Armar instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1 -ExpandProperty FullName
          & $iscc /DAppVersion=${{ env.VERSION }} /DPublishDir=publish installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló" }

      - name: Crear Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create $env:TAG Output/AlarmaDecibeles-Setup.exe --title "Alarma Decibeles $env:TAG" --generate-notes
