# Al subir un tag vX.Y.Z: compila la app, arma el instalador y lo publica como Release en GitHub.
#   git tag v1.0.2
#   git push origin v1.0.2
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Versión desde el tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "El tag debe ser vX.Y.Z (recibí ${{ github.ref_name }})" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Publicar app (self-contained, no necesita .NET instalado)
        run: dotnet publish AlarmaDecibeles.csproj -c Release -r win-x64 --self-contained -p:Version=${{ env.VERSION }} -o publish

      - name: Armar instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1 -ExpandProperty FullName
          & $iscc /DAppVersion=${{ env.VERSION }} /DPublishDir=publish installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló" }

      - name: Crear Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} Output/AlarmaDecibeles-Setup.exe --title "Alarma Decibeles ${{ github.ref_name }}" --generate-notes
